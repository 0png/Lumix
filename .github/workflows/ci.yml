name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  windows-package:
    name: Build Windows installer
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm --filter @lumix/app build:win

      - name: Verify packaged application starts
        shell: pwsh
        run: |
          $executable = Resolve-Path "packages/app/dist/win-unpacked/Lumix.exe"
          $profile = Join-Path $env:RUNNER_TEMP "lumix-smoke-profile"
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $process = Start-Process -FilePath $executable -ArgumentList "--user-data-dir=$profile" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Packaged Lumix exited during the startup smoke test (exit code $($process.ExitCode))."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumix-windows-${{ github.sha }}
          path: |
            packages/app/dist/Lumix-Setup-*.exe
            packages/app/dist/Lumix-Setup-*.exe.blockmap
            packages/app/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
